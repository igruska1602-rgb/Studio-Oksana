name: Build Studio Oksana APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unpack project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found archive: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          
          # Ищем папку, где лежит build.gradle или build.gradle.kts
          PROJECT_DIR="$(find source -name "build.gradle*" -print -quit | xargs -r dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          # Если gradle wrapper нет, генерируем его автоматически на лету
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Oksana-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
